name: ENCORE CI

on:
  push:
    branches: [main, encore-0.8-implementation, encore-0.8.1-depth, encore-0.8.2-polish, encore-0.8.3-weekly, encore-0.8.4-portrait-hotfix, encore-0.8.4-portrait-quality, encore-0.8.4-roster-weeklabel, encore-0.8.5-unique-portraits-rebase]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  critical-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ENCORE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run critical cohesion / industry / release / UI tests
        run: npm run build && node tests/v118-cohesion-core.mjs && node tests/v119-living-industry.mjs && node tests/v120-release-strategy.mjs && node tests/charts-engine.mjs && node tests/week-transaction.mjs && node tests/finance-engine.mjs && node tests/icon-system.mjs

  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ENCORE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run ENCORE regression suite
        run: npm run build && npm run test:regression

  long-career:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [inactive, releasing, legacy-sandbox]
    defaults:
      run:
        working-directory: ENCORE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build ENCORE
        run: npm run build
      - name: Run 20-year career scenario
        env:
          ENCORE_LONG_SCENARIO: ${{ matrix.scenario }}
        run: node tests/long-career.mjs

  touring-career:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ENCORE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build ENCORE
        run: npm run build
      - name: Run 20-year touring scenario
        run: node tests/touring-career.mjs
