name: ENCORE CI

on:
  push:
    branches: [main, encore-0.8-implementation, encore-0.8.1-depth, encore-0.8.2-polish, encore-0.8.3-weekly, encore-0.8.4-portrait-hotfix, encore-0.8.4-portrait-quality, encore-0.8.4-roster-weeklabel]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ENCORE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run ENCORE regression suite
        run: npm test
