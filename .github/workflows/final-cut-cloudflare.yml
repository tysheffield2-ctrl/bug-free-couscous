name: FINAL CUT — Deploy to Cloudflare

on:
  push:
    branches:
      - final-cut-cloudflare
    paths:
      - "FINAL-CUT/**"
      - ".github/workflows/final-cut-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-cut-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy FINAL CUT only
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FINAL-CUT
    steps:
      - name: Checkout FINAL CUT branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify standalone game files
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('public/index.html','utf8'); if(!s.includes('FINAL CUT') || !s.includes('</html>') || s.length<100000) process.exit(1)"

      - name: Verify Cloudflare credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare GitHub Actions credentials not configured."
            exit 1
          fi

      - name: Deploy separate FINAL CUT Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.68.0 deploy --config wrangler.jsonc
