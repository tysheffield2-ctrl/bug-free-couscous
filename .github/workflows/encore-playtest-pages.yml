name: ENCORE Playtest Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ENCORE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run critical playtest gate
        run: npm run build && node tests/v118-cohesion-core.mjs && node tests/v119-living-industry.mjs && node tests/v120-release-strategy.mjs && node tests/charts-engine.mjs && node tests/week-transaction.mjs && node tests/finance-engine.mjs

      - name: Build static playtest
        run: node build-raw-playtest.mjs

      - name: Upload playtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: encore-playtest
          path: ENCORE/dist/raw-playtest
          if-no-files-found: error
