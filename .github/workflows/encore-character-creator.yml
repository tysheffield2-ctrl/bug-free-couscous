name: ENCORE character creator browser check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ENCORE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build && node tests/v129-character-creator.mjs && node tests/character-creator-browser.cjs && node tests/v144-contract-browser.cjs && node tests/v145-label-boss-browser.cjs && node build-raw-playtest.mjs && node tests/v146-static-playtest-browser.cjs && node tests/v147-artist-negotiation-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-creator-mobile
          path: |
            ENCORE/creator-mobile.png
            ENCORE/creator-failure.txt
            ENCORE/encore-contract-signature.png
            ENCORE/contract-signature-failure.png
            ENCORE/contract-signature-failure.txt
            ENCORE/label-boss-browser-failure.txt
            ENCORE/label-boss-browser-failure.png
            ENCORE/static-playtest-failure.txt
            ENCORE/static-playtest-failure.png
            ENCORE/artist-negotiation-browser-failure.txt
            ENCORE/artist-negotiation-browser-failure.png
          if-no-files-found: ignore
