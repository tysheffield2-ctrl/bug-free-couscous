name: ENCORE character creator browser check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ENCORE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build && node tests/v129-character-creator.mjs && node tests/character-creator-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-creator-mobile
          path: ENCORE/creator-mobile.png
