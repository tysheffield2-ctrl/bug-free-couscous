/* ENCORE 0.9 — intentional visual language.
   Goal: less generic app chrome, more music-world identity. */

:root{
 --encore-gold:#e7bf7a;
 --encore-cream:#f3eadb;
 --encore-ink:#0b0e10;
 --encore-panel:#12171b;
 --encore-line:rgba(240,230,211,.15);
}

/* Shared: flatter, editorial, less template-like */
#app{border-radius:0!important;padding-top:0!important;background:none!important}
#app .card{border-radius:4px!important;box-shadow:none!important;border:1px solid var(--encore-line)!important;position:relative;overflow:hidden}
#app .card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--section-accent,#d9b875);opacity:.75}
#app .primary,#app .secondary,#app .destination,#app .screen-tabs button,#app .social-actions button,#app .ticker-strip button{border-radius:3px!important}
#app h1,#app h2,#app h3{letter-spacing:-.02em}
#app .eyebrow{letter-spacing:.18em;font-size:10px;font-weight:800}
#app .fine{line-height:1.55}

.theme-studio{--section-accent:#c6a6ff!important;--section-tint:#17121f!important}
.theme-studio main,.theme-studio .screen-create{background:

 linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
 #0d1015!important;background-size:28px 28px!important}

.studio-creative-brief{padding:22px!important;background:#11151c!important}

 .negotiation-room{padding:16px 14px 60px}

 .negotiation-table{grid-template-columns:1fr}
 .negotiation-counterparty,.negotiation-room-meters,.negotiation-offer-sheet{grid-column:1;grid-row:auto}

 .negotiation-room-actions{grid-template-columns:1fr 1.35fr}
}

 dialog:has(.artist-profile),dialog:has(.social-profile){width:min(900px,92vw);max-width:900px;border-radius:2px!important;border:1px solid var(--dossier-rule);padding:0!important}

/* ENCORE v1.07 — Dark Pastel Editorial Design System
   Global readability + system identity layer for the fully interactive renderer.
   Pastels are accents; important information stays warm-white and high contrast. */

:root{
  --encore-bg:#151719;
  --encore-bg-deep:#101214;
  --encore-surface:#1d2023;
  --encore-surface-raised:#25282c;
  --encore-surface-soft:#2c3034;
  --encore-text:#fff8ec;
  --encore-text-soft:#d8d3ca;
  --encore-text-muted:#b2afa9;
  --encore-text-faint:#96938e;
  --encore-divider:#45484c;
  --encore-divider-soft:#35383c;
  --encore-gold:#e6be72;
  --encore-peach:#e9ad91;
  --encore-rose:#dda0ac;
  --encore-lavender:#bba6d9;

  --v106-bg:var(--encore-bg);
  --v106-panel:var(--encore-surface);
  --v106-panel-2:var(--encore-surface-raised);

  --v106-red:var(--encore-red);
  --v106-blue:var(--encore-blue);
  --v106-purple:var(--encore-lavender);
}

/* The approved black-and-gold shell. Scope structural rules to these controls. */
:root{
 --encore-bg:#071119;--encore-bg-deep:#040b10;--encore-surface:#101b22;--encore-surface-raised:#19252d;--encore-surface-soft:#223039;
 --encore-text:#fff8e9;--encore-text-soft:#ded8ca;--encore-text-muted:#b9b1a1;--encore-text-faint:#8f897d;
 --encore-gold:#f1cf7a;--encore-cream:#fff0bf;--encore-peach:#e8c56f;--encore-rose:#d9ae55;--encore-lavender:#f0d98f;--encore-blue:#e2bf68;--encore-sage:#caa45a;--encore-sand:#ddb96c;--encore-coral:#d3a052;
 --encore-mint:#a9c9ae;--encore-red:#e79791;--encore-button-text:#071119;
 --encore-divider:#665a40;--encore-divider-soft:#29343b
}
body{background:radial-gradient(ellipse at 50% 0,rgba(74,95,105,.14),transparent 55rem),#071119!important}
body header{background:rgba(7,17,25,.965)!important;border-bottom-color:var(--encore-divider-soft)!important}
body .weekbar{background:rgba(8,17,24,.985)!important;border-top-color:var(--encore-divider)!important;border-bottom-color:var(--encore-divider-soft)!important}
/* Icons intentionally paint with currentColor rather than a fragment-linked SVG
   gradient so iOS/WebKit cannot lose the glyph when dynamic screens are rebuilt. */
.encore-icon{display:block;width:44px;height:44px;flex-shrink:0;color:#f1cf7a;fill:currentColor;stroke:none;filter:drop-shadow(0 2px 3px #0005)}
/* iPhone/WebKit can fail to propagate an SVG-root fill into dynamically replaced
   child primitives even while explicit stroke paint survives. Paint every fill-only
   primitive directly so Home/Charts/More and the filled portions of mixed icons
   cannot disappear after navigation or an innerHTML rebuild. */
.encore-icon path:not([fill]):not([stroke]),.encore-icon rect:not([fill]):not([stroke]),.encore-icon circle:not([fill]):not([stroke]),.encore-icon ellipse:not([fill]):not([stroke]){fill:currentColor!important}
.encore-sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important}
.encore-wordmark{display:inline-flex;align-items:center;font-weight:950;letter-spacing:-.06em;color:#fff7e5!important}
.encore-wordmark i{display:inline-block;width:.82em;height:.82em;margin:0 .015em;border-radius:50%;background:radial-gradient(circle,#f5d77d 0 6%,#071119 7% 22%,transparent 23%),conic-gradient(from 20deg,#aa722a,#fff2b3,#d5a242,#ffe7a0,#aa722a);box-shadow:inset 0 0 0 1px #ffe1a177}
body #nav{background:linear-gradient(160deg,#16232bf5,#050d13fa)!important;border-top:1px solid #8c7a535c!important}
body #nav button{color:#e7e3d9!important;gap:0!important;position:relative}
body #nav .encore-nav-icon{height:37px;display:flex;align-items:center;justify-content:center;margin:0 auto 3px}
body #nav button svg.encore-icon,body #nav .nav-home svg.encore-icon{width:27px!important;height:27px!important;stroke:none!important;background:transparent!important;padding:0!important;margin:0!important;border:0!important;box-shadow:none!important;overflow:visible}
body #nav .nav-home .encore-nav-icon{border:1px solid #d9c28e;box-shadow:inset 0 1px 7px #fff1b329,0 3px 12px #0007;border-radius:50%;width:47px;height:47px;margin-top:-10px;background:linear-gradient(145deg,#8f7a50,#342d22)}
body #nav button.active:after{content:'';position:absolute;width:26px;height:3px;background:#f3d47f;border-radius:4px;bottom:3px;left:calc(50% - 13px)}
