<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05080c">
  <title>ENCORE — UI2 Preview</title>
  <style>:root{
  color-scheme:dark;
  --bg:#05080c;
  --bg-soft:#091018;
  --surface:#0d151d;
  --surface-2:#111c26;
  --line:#24313d;
  --line-soft:#19242e;
  --ink:#f4f2ec;
  --muted:#95a1ad;
  --faint:#64717d;
  --gold:#d2aa60;
  --green:#6fce8d;
  --red:#df746c;
  --blue:#77afe6;
  --purple:#a989e8;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{overflow-x:hidden}
button,a{font:inherit}
button{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ui2-root{min-height:100dvh;background:linear-gradient(180deg,#07101a 0,#05080c 34%,#05080c 100%)}
.ui2-app{min-height:100dvh;padding-bottom:calc(86px + var(--safe-bottom))}
.ui2-topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px 14px;
  align-items:center;
  min-height:calc(66px + var(--safe-top));
  padding:calc(10px + var(--safe-top)) 18px 10px;
  background:rgba(5,8,12,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.ui2-brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.24em;font-size:18px}
.ui2-brand-mark{color:var(--gold)}
.ui2-status{justify-self:end;font-size:11px;color:#cbd1d6;border:1px solid #3b4751;padding:7px 10px;border-radius:999px;white-space:nowrap}
.ui2-topmeta{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;letter-spacing:.04em}
.ui2-topmeta strong{color:#dcd9d2;font-weight:700}
.ui2-main{width:min(100%,1100px);margin:0 auto}
.ui2-screen{min-height:calc(100dvh - 150px)}
.ui2-screen-head{display:flex;justify-content:space-between;gap:18px;align-items:end;padding:26px 18px 16px;border-bottom:1px solid var(--line)}
.ui2-kicker{display:block;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px}
.ui2-screen-head h1{margin:0;font-size:clamp(30px,8vw,54px);line-height:.95;letter-spacing:-.045em}
.ui2-screen-head p{margin:6px 0 0;color:var(--muted);max-width:520px;font-size:13px;line-height:1.55}
.ui2-inline-action{border:0;background:none;color:#d9ba78;font-weight:750;padding:5px 0;cursor:pointer}
.ui2-divider{height:1px;background:var(--line)}
.ui2-section-title{display:flex;justify-content:space-between;gap:12px;align-items:end;padding:24px 18px 10px}
.ui2-section-title h2{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.ui2-section-title small{color:var(--faint);font-size:10px}

/* HOME — one continuous career surface, not nested floating boxes. */
.ui2-home-hero{position:relative;min-height:430px;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}
.ui2-home-visual{position:absolute;inset:0;background:
  radial-gradient(circle at 72% 22%,rgba(119,175,230,.22),transparent 22rem),
  radial-gradient(circle at 12% 30%,rgba(210,170,96,.15),transparent 20rem),
  linear-gradient(135deg,#172431 0%,#0a121b 42%,#05080c 100%)}
.ui2-home-visual:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#05080c 0%,rgba(5,8,12,.82) 22%,rgba(5,8,12,.12) 70%)}
.ui2-stage-lines{position:absolute;inset:auto 8% 22% 8%;height:34%;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.05);transform:perspective(500px) rotateX(64deg);opacity:.55}
.ui2-stage-lines:before,.ui2-stage-lines:after{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.08)}
.ui2-stage-lines:before{top:33%}.ui2-stage-lines:after{top:66%}
.ui2-home-copy{position:relative;z-index:2;width:100%;padding:90px 18px 22px}
.ui2-home-name{margin:0;font-size:clamp(48px,13vw,84px);line-height:.85;letter-spacing:-.06em;text-transform:uppercase;max-width:740px}
.ui2-home-sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;color:#c9d0d5;font-size:12px}
.ui2-home-sub span+span:before{content:"•";margin-right:8px;color:#5d6872}
.ui2-primary-link{margin-top:22px;border:0;background:none;padding:0;color:#f1d18c;font-weight:850;font-size:13px;cursor:pointer}
.ui2-primary-link span{display:inline-block;margin-left:8px;transition:transform .18s ease}
.ui2-primary-link:hover span{transform:translateX(4px)}
.ui2-ledger{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);background:#070c11}
.ui2-ledger-item{padding:16px 14px;border-right:1px solid var(--line)}
.ui2-ledger-item:last-child{border-right:0}
.ui2-ledger-item small{display:block;color:var(--faint);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.ui2-ledger-item strong{display:block;font-size:clamp(16px,5vw,26px);letter-spacing:-.035em;overflow-wrap:anywhere}
.ui2-ledger-item em{display:block;margin-top:5px;font-size:10px;font-style:normal;color:var(--green)}
.ui2-release-strip{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);background:#0a1118;cursor:pointer}
.ui2-release-art{width:54px;height:54px;display:grid;place-items:center;background:linear-gradient(145deg,#16293b,#2f1e2e);font-weight:900;font-size:18px;border:1px solid #374652}
.ui2-release-strip small{display:block;color:var(--faint);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.ui2-release-strip strong{display:block;margin:3px 0;font-size:16px}
.ui2-release-strip span{color:var(--muted);font-size:11px}
.ui2-release-strip b{font-size:22px;color:#d3b26d}
.ui2-feed{border-top:1px solid var(--line-soft)}
.ui2-feed-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line-soft);background:transparent;cursor:pointer}
.ui2-feed-row:hover{background:#091018}
.ui2-feed-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid #34414b;color:#d2ae67;font-weight:850;font-size:11px}
.ui2-feed-copy strong{display:block;font-size:13px;line-height:1.35}
.ui2-feed-copy span{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:4px}
.ui2-feed-meta{font-size:10px;color:var(--faint);white-space:nowrap}
.ui2-actions-line{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.ui2-actions-line button{border:0;border-right:1px solid var(--line);background:#071018;padding:16px 10px;color:#d4d8dc;font-weight:700;font-size:11px;cursor:pointer}
.ui2-actions-line button:last-child{border-right:0}
.ui2-actions-line button:hover{background:#0d1720;color:#fff}

/* ARTIST FILE — portrait, ledger, history; one dossier flow. */
.ui2-artist-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);min-height:500px;border-bottom:1px solid var(--line)}
.ui2-portrait-zone{position:relative;overflow:hidden;background:linear-gradient(160deg,#172431,#0b1218 58%,#05080c)}
.ui2-portrait-zone:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,8,12,.94),transparent 56%),linear-gradient(90deg,transparent 58%,rgba(5,8,12,.72))}
.ui2-avatar{position:absolute;inset:7% 10% 0;display:flex;align-items:flex-end;justify-content:center}
.ui2-avatar svg{width:min(92%,520px);height:92%;filter:drop-shadow(0 25px 40px rgba(0,0,0,.35))}
.ui2-artist-identity{position:absolute;left:20px;right:20px;bottom:24px;z-index:2}
.ui2-artist-identity h1{margin:0;font-size:clamp(44px,9vw,78px);line-height:.88;letter-spacing:-.055em}
.ui2-artist-identity p{margin:10px 0 0;color:#c5cdd3;font-size:12px}
.ui2-artist-sidebar{display:flex;flex-direction:column;background:#070c11;border-left:1px solid var(--line)}
.ui2-artist-fact{display:flex;justify-content:space-between;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.ui2-artist-fact span{color:var(--muted);font-size:11px}
.ui2-artist-fact strong{font-size:12px;text-align:right}
.ui2-artist-quote{margin-top:auto;padding:26px 18px;color:#dcd8cf;font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.25;border-top:1px solid var(--line)}
.ui2-stat-list{border-top:1px solid var(--line-soft)}
.ui2-stat-line{display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.ui2-stat-line label{font-size:12px;color:#dfe2e4}
.ui2-stat-track{height:6px;background:#18232c;overflow:hidden}
.ui2-stat-track i{display:block;height:100%;background:var(--gold)}
.ui2-stat-line:nth-child(2) .ui2-stat-track i{background:var(--blue)}
.ui2-stat-line:nth-child(3) .ui2-stat-track i{background:var(--purple)}
.ui2-stat-line:nth-child(4) .ui2-stat-track i{background:var(--red)}
.ui2-stat-line:nth-child(5) .ui2-stat-track i{background:var(--green)}
.ui2-stat-line strong{font-size:13px;min-width:30px;text-align:right}
.ui2-history{border-top:1px solid var(--line-soft)}
.ui2-history-row{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.ui2-history-row time{color:var(--faint);font-size:10px;padding-top:2px}
.ui2-history-row p{margin:0;color:#d5d8da;font-size:12px;line-height:1.45}

/* BUSINESS HQ — statement + inbox + departments, not a tiled dashboard. */
.ui2-business-hero{padding:30px 18px 22px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#0d1720,#070b10 72%)}
.ui2-business-hero h1{margin:6px 0 6px;font-size:clamp(36px,8vw,64px);letter-spacing:-.05em}
.ui2-business-hero p{margin:0;color:var(--muted);font-size:12px;max-width:580px;line-height:1.55}
.ui2-business-ledger{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.ui2-business-number{padding:17px 14px;border-right:1px solid var(--line);min-width:0}
.ui2-business-number:last-child{border-right:0}
.ui2-business-number small{display:block;color:var(--faint);font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.ui2-business-number strong{display:block;font-size:clamp(15px,4vw,24px);letter-spacing:-.04em;overflow-wrap:anywhere}
.ui2-business-number.profit strong{color:var(--green)}
.ui2-statement{padding:0 18px;border-bottom:1px solid var(--line)}
.ui2-statement-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.ui2-statement-row:last-child{border-bottom:0}
.ui2-statement-row span{color:var(--muted);font-size:11px}
.ui2-statement-row strong{font-size:12px;text-align:right}
.ui2-inbox{border-top:1px solid var(--line-soft)}
.ui2-inbox-row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.ui2-inbox-row:hover{background:#091018}
.ui2-inbox-badge{width:40px;height:40px;display:grid;place-items:center;background:#111a23;border:1px solid #34404a;font-weight:850;font-size:10px;color:#d1ae68}
.ui2-inbox-row strong{display:block;font-size:13px}
.ui2-inbox-row span{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}
.ui2-inbox-row b{color:#d5b66d;font-size:18px}
.ui2-departments{border-top:1px solid var(--line-soft)}
.ui2-department{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:17px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.ui2-department:hover{background:#091018}
.ui2-dept-code{font-size:10px;color:#d4b26d;letter-spacing:.08em}
.ui2-department strong{display:block;font-size:13px}
.ui2-department span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.ui2-department b{font-size:18px;color:#6e7a84}

/* placeholder destinations establish the shell without pretending migration is done. */
.ui2-placeholder{min-height:calc(100dvh - 160px);display:grid;place-items:center;padding:32px 18px;text-align:center}
.ui2-placeholder-inner{max-width:460px}
.ui2-placeholder h1{font-size:42px;letter-spacing:-.05em;margin:8px 0 12px}
.ui2-placeholder p{color:var(--muted);line-height:1.6;font-size:13px}
.ui2-placeholder button{margin-top:16px;border:1px solid #3c4852;background:#0b1218;color:#f0eee8;padding:11px 15px;border-radius:6px;font-weight:750;cursor:pointer}

/* bottom navigation — persistent and deliberately simple. */
.ui2-bottomnav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  height:calc(72px + var(--safe-bottom));
  padding:0 4px var(--safe-bottom);
  background:rgba(5,8,12,.98);
  border-top:1px solid var(--line);
  backdrop-filter:blur(18px);
}
.ui2-bottomnav button{position:relative;border:0;background:none;color:#6f7b85;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;font-weight:750;cursor:pointer}
.ui2-bottomnav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.ui2-bottomnav button.is-active{color:#f0ede5}
.ui2-bottomnav button.is-active:after{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--gold)}
.ui2-bottomnav .ui2-home-button svg{width:30px;height:30px;padding:6px;background:var(--gold);color:#0c0d0f;border-radius:8px;stroke-width:2}
.ui2-bottomnav .ui2-home-button.is-active:after{display:none}
.ui2-bottomnav .ui2-home-button.is-active svg{box-shadow:0 0 0 1px #f0cf88}

.ui2-toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));z-index:200;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);background:#111921;border:1px solid #35424c;color:#e4e5e2;padding:10px 14px;border-radius:8px;font-size:11px;transition:.18s ease}
.ui2-toast.is-visible{opacity:1;transform:translateX(-50%) translateY(0)}
.ui2-error{padding:60px 20px;text-align:center;color:#d6d8da}
.ui2-error h1{font-size:32px;margin:0 0 10px}.ui2-error p{color:var(--muted);line-height:1.5}

@media(max-width:720px){
  .ui2-topbar{padding-left:14px;padding-right:14px}
  .ui2-home-hero{min-height:390px}
  .ui2-home-copy{padding-left:16px;padding-right:16px}
  .ui2-ledger-item{padding:14px 10px}
  .ui2-artist-hero{grid-template-columns:1fr;min-height:auto}
  .ui2-portrait-zone{min-height:420px}
  .ui2-artist-sidebar{border-left:0;border-top:1px solid var(--line)}
  .ui2-artist-quote{font-size:19px}
  .ui2-business-ledger{grid-template-columns:1fr 1fr}
  .ui2-business-number:nth-child(2){border-right:0}
  .ui2-business-number:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .ui2-stat-line{grid-template-columns:100px 1fr auto}
}
@media(max-width:390px){
  .ui2-brand{font-size:16px}
  .ui2-status{font-size:9px;padding:6px 8px}
  .ui2-topmeta{font-size:9px}
  .ui2-home-name{font-size:44px}
  .ui2-ledger{grid-template-columns:1fr 1fr}
  .ui2-ledger-item:nth-child(2){border-right:0}
  .ui2-ledger-item:nth-child(3){grid-column:1/-1;border-top:1px solid var(--line);border-right:0}
  .ui2-release-strip{grid-template-columns:46px 1fr auto;padding-left:14px;padding-right:14px}
  .ui2-release-art{width:46px;height:46px}
  .ui2-actions-line{grid-template-columns:1fr}
  .ui2-actions-line button{border-right:0;border-bottom:1px solid var(--line)}
  .ui2-actions-line button:last-child{border-bottom:0}
  .ui2-stat-line{grid-template-columns:86px 1fr auto;padding-left:14px;padding-right:14px}
  .ui2-screen-head,.ui2-section-title,.ui2-business-hero{padding-left:14px;padding-right:14px}
  .ui2-statement,.ui2-home-copy{padding-left:14px;padding-right:14px}
  .ui2-feed-row,.ui2-inbox-row,.ui2-department,.ui2-history-row{padding-left:14px;padding-right:14px}
}

.ui2-advance-week{display:block;width:100%;margin:26px 0 8px;padding:19px 24px;border:1px solid #d9f58b;background:#d9f58b;color:#101610;font:700 16px inherit;cursor:pointer;border-radius:3px}.ui2-command-busy .ui2-advance-week{opacity:.5;pointer-events:none}.ui2-week-dialog{box-sizing:border-box;width:min(92vw,520px);max-height:85dvh;overflow:auto;padding:28px;background:#111820;color:#f1f4ee;border:1px solid #59654b;border-radius:10px;font-family:inherit}.ui2-week-dialog::backdrop{background:#000b}.ui2-week-dialog h2{font-size:26px;margin:0 0 20px}.ui2-week-dialog p{line-height:1.55;color:#c6cec4}.ui2-week-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.ui2-week-actions button{padding:14px 18px;cursor:pointer;background:#d9f58b;color:#101610;border:0;border-radius:4px;font-weight:700}.ui2-week-actions button:first-child:not(:last-child){background:#28312d;color:#fff}

.ui2-setup-notice{padding:22px;background:#20261a;color:#eff5dd;line-height:1.5}.ui2-setup-notice a{color:#d9f58b;text-decoration:underline}

/* UI2 Phase 2 — native Studio + Charts. No legacy card/panel primitives. */
.ui2-studio,.ui2-charts{min-height:calc(100dvh - 150px);background:#05090d}
.ui2-studio-head,.ui2-chart-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding:28px 18px 18px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#0c151e 0%,#070b10 72%)}
.ui2-studio-head h1,.ui2-chart-head h1{margin:4px 0 7px;font-size:clamp(38px,9vw,68px);line-height:.9;letter-spacing:-.055em}
.ui2-studio-head p,.ui2-chart-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.55;max-width:620px}
.ui2-session-energy{text-align:right;flex:0 0 auto}
.ui2-session-energy small{display:block;color:var(--faint);font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.ui2-session-energy strong{font-size:30px;letter-spacing:-.05em}.ui2-session-energy strong span{font-size:12px;color:var(--muted);margin-left:2px}
.ui2-studio-room{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);border-bottom:1px solid var(--line);min-height:520px}
.ui2-console-stage{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:520px;padding:22px;background:radial-gradient(circle at 68% 20%,rgba(119,175,230,.14),transparent 28rem),linear-gradient(160deg,#14212d 0,#0a1118 48%,#05080c 100%);overflow:hidden}
.ui2-console-stage:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,8,12,.95),transparent 66%);pointer-events:none}
.ui2-console-stage>*{position:relative;z-index:1}
.ui2-redlight{position:absolute;top:22px;left:22px;display:flex;align-items:center;gap:8px;color:#c7cdd2;font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.ui2-redlight i{width:8px;height:8px;border-radius:50%;background:#707b84;box-shadow:0 0 0 4px rgba(255,255,255,.035)}
.ui2-redlight.live i{background:#e55f58;box-shadow:0 0 16px rgba(229,95,88,.75)}
.ui2-working-title{margin-bottom:18px;max-width:760px}.ui2-working-title small{display:block;color:#7f8b94;font-size:9px;text-transform:uppercase;letter-spacing:.12em}.ui2-working-title h2{margin:5px 0 7px;font-size:clamp(44px,9vw,78px);line-height:.88;letter-spacing:-.055em}.ui2-working-title p{margin:0;color:#b8c0c6;font-size:12px;line-height:1.5}
.ui2-waveform{height:88px;display:flex;align-items:center;gap:2px;padding:10px 0;margin-bottom:20px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.06)}
.ui2-waveform i{display:block;flex:1;height:var(--h);min-width:1px;background:#8e9aa3;opacity:.65}.ui2-waveform.live i{background:linear-gradient(180deg,#e3c17b,#8f6c35);opacity:.92}

/* ENCORE UI2 Phase 7 — player-facing finish pass.

/* Compact the global game chrome so each screen owns more of the viewport. */
.ui2-topbar{
  grid-template-columns:auto 1fr!important;
  gap:5px 12px!important;
  min-height:auto!important;
  padding:calc(7px + var(--safe-top)) 15px 7px!important;
  background:rgba(4,7,10,.965)!important;
  border-bottom-color:#3c3324!important;
}
.ui2-brand{font-size:16px!important;letter-spacing:.22em!important;gap:6px!important}
.ui2-status{
  justify-self:end!important;
  padding:5px 8px!important;
  font-size:9px!important;
  line-height:1!important;
  color:#d8c9a8!important;
  border-color:#4b4438!important;
  background:rgba(210,170,96,.035)!important;
}
.ui2-topmeta{
  grid-column:1/-1!important;
  min-height:18px!important;
  align-items:center!important;
  justify-content:flex-end!important;
  font-size:9px!important;
  line-height:1.15!important;
  letter-spacing:.055em!important;
  color:#788590!important;
}
.ui2-topmeta span:first-child{display:none!important}
.ui2-topmeta span:last-child{margin-left:auto!important}
.ui2-sandbox-mode .ui2-topmeta{justify-content:space-between!important}
.ui2-sandbox-mode .ui2-topmeta span:first-child{display:block!important;color:#c5a566!important}
.ui2-sandbox-mode .ui2-topmeta span:last-child{margin-left:0!important}
.ui2-lab-mark{font-size:7px!important;padding:3px 5px!important;letter-spacing:.16em!important}

/* Week close is a core ENCORE action, not a lime prototype control. */
.ui2-advance-week{
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:calc(100% - 30px)!important;
  min-height:58px!important;
  margin:20px 15px 24px!important;
  border:1px solid #efd089!important;
  border-radius:8px!important;

.ui2-advance-week:hover{filter:brightness(1.035)!important}
.ui2-advance-week:active{transform:translateY(1px)!important}

/* Release artwork should read as a cover, not an initials placeholder. */
.ui2-release-strip{grid-template-columns:62px 1fr auto!important;padding:13px 15px!important}
.ui2-release-art{
  position:relative!important;
  width:62px!important;
  height:62px!important;
  overflow:hidden!important;
  isolation:isolate!important;
  border:1px solid rgba(255,255,255,.18)!important;
  background:
    radial-gradient(circle at 78% 20%,hsla(var(--cover-h,215),82%,70%,.88),transparent 23%),
    linear-gradient(145deg,hsl(var(--cover-h,215) 54% 25%),hsl(calc(var(--cover-h,215) + 38) 44% 13%) 66%,#08090b)!important;

  color:#fff!important;
  font-size:0!important;

  content:"";
  position:absolute;
  inset:8px;
  z-index:-1;
  border:1px solid rgba(255,255,255,.18);
  transform:rotate(-8deg);

.ui2-release-art:after{
  content:attr(data-cover-mark);

  left:7px;
  right:7px;
  bottom:6px;

  font-weight:900;
  letter-spacing:.09em;

  <div id="ui2-root" class="ui2-root" aria-live="polite"></div>
  <script>/* Player release settlement shared by all ENCORE interfaces.

(function (global) {
  "use strict";
  function finite(value, fallback = 0) {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  }
  function focusLift(s, track) {
    const focus = s?.v133?.streamFocus;
    if (!focus || finite(focus.week, -1) !== finite(s.week, 0)) return 0;
    const songMatch =
      focus.kind === "songs" && finite(focus.id, -1) === finite(track.id, -2);
    const albumMatch =
      focus.kind === "albums" &&
      finite(focus.id, -1) === finite(track.album, -2);
    if (!songMatch && !albumMatch) return 0;
    const lift = Math.max(0, Math.min(0.3, finite(focus.lift, 0)));
    return albumMatch ? lift * 0.65 : lift;
  }
  function streamCeiling(s, track, lift = 0) {
    const fans = Math.max(0, finite(s?.fans, 0));
    const listeners = Math.max(0, finite(s?.expansion?.listeners, 0));
    const fanAudience = 260000000 * (1 - Math.exp(-fans / 35000000));
    const listenerAudience = 220000000 * (1 - Math.exp(-listeners / 45000000));
    const audience = Math.max(fanAudience, listenerAudience * 0.9);
    const quality = Math.max(0, Math.min(100, finite(track?.quality, 60))) / 100;
    const commercial =
      Math.max(0, Math.min(100, finite(track?.commercial, 55))) / 100;
    const reputation =
      Math.max(0, Math.min(100, finite(s?.reputation, 0))) / 100;
    const released = finite(track?.released, finite(s?.week, 1));
    const age = Math.max(0, finite(s?.week, 1) - released);
    const lifecycle = age === 0 ? 1.16 : age < 4 ? 1.08 : age < 12 ? 1 : 0.92;
    let ceiling =
      750000 +
      audience *
        (0.62 + quality * 0.22 + commercial * 0.14 + reputation * 0.12) *
        lifecycle;
    ceiling *= 1 + Math.max(0, lift) * 0.35;
    return Math.round(Math.max(750000, Math.min(400000000, ceiling)));
  }
  function normalizeStreams(s, track, demand) {
    const raw = Math.max(0, finite(demand, 0));
    const lift = focusLift(s, track);
    const pushed = raw * (1 + lift);
    const ceiling = streamCeiling(s, track, lift);
    const threshold = ceiling * 0.55;
    let final = pushed;
    if (pushed > threshold) {
      const room = Math.max(1, ceiling - threshold);
      final = threshold + room * (1 - Math.exp(-(pushed - threshold) / room));
    }
    final = Math.max(8, Math.round(Math.min(ceiling, final)));
    track.streamModel = {
      week: finite(s?.week, 0),
      raw: Math.round(raw),
      focusLift: lift,
      ceiling,
      final,
      saturated: pushed > threshold,
    };

    const {
      reach,
      reception,
      directionFor,
      rand,
      clamp,
      log,
      compact,
      outcome,
      adjustReleaseStreams,
      recordRegionalStreams,

      added = 0,
      debut = [];

      .filter((x) => x.released)
      .forEach((x) => {

            : 0;

            ? clamp(Number(x.releaseStrategyLift), 0.78, 1.22)
            : 1;

            reception(x.quality) *
            (x.songRules === 2 ? 0.55 + x.commercial * 0.009 : 1) *
            (x.mood.startsWith("Raw")

            (1 + s.boost) *
            (x.albumBoost === s.week ? 1.15 : 1) *
            strategyLift;

          x.launchFans = s.fans;

            n / (1 + s.boost) / (x.albumBoost === s.week ? 1.15 : 1);
          x.breakdown =
            "Expected reach " +
            compact(x.base) +
            "; quality " +
            x.quality +
            "/100" +
            (x.songRules === 2
              ? "; commercial potential " + x.commercial + "/100"
              : "") +
            "; " +
            x.mood.split(" /")[0].toLowerCase() +
            " direction" +
            (guest ? "; guest " + guest.name : "") +
            "; promotion " +
            Math.round(s.boost * 100) +
            "%" +
            (strategyLift !== 1
              ? "; release strategy " +
                (strategyLift >= 1 ? "+" : "") +
                Math.round((strategyLift - 1) * 100) +
                "%"
              : "") +
            ". Audience reception helped determine the final " +
            x.factor.toFixed(2) +
            "× debut. " +
            (x.factor < 0.65
              ? "Try improving your craft before your next recording."
              : x.factor >= 1.5
                ? "This release outperformed its expected audience."
                : "This release performed within the expected range.");

            s.reputation +
              (x.quality >= 60 ? 1 : 0) +
              (x.factor >= 1.5 ? 2 : 0),
          );
          debut.push(x);
          log(
            "“" +
              x.title +
              "” debuted with " +
              compact(n) +
              " streams: " +
              outcome(x.factor).toLowerCase() +
              ".",
          );
        } else {
          let guest = x.feature ? s.world[x.feature.id] : null;
          let conflict = guest && guest.relation <= -40 ? 0.8 : 1;
          x.organic = Math.max(
            8,
            (x.organic ?? x.streams) * rand(...directionFor(x).decay) +
              (s.fans * 0.002) /
                Math.sqrt(

              conflict *
              (x.albumBoost === s.week ? 1.15 : 1),

            x.songRules === 2 &&

        n = normalizeStreams(s, x, n);
        recordRegionalStreams(x, n);
        if (x.released === s.week) {

            " Genre fit " +
            x.marketFit +
            "%; release spacing " +
            Math.round(x.rolloutFactor * 100) +
            "%.";
        }
        x.streams = n;
        x.total += n;
        count += n;
        added += Math.round(
          n *
            directionFor(x).fans *
            (1 + s.loyalty / 200) *
            (x.songRules === 2 ? 0.75 + level("charisma") * 0.005 : 1),

/* Canonical weekly phases, independent of rendering and persistence.
   Hooks retain the existing subsystem implementations during their migration. */
(function (global) {
  "use strict";
  function settle(s, h) {
    const {

      beginCareerWeek,
      settleLivingWorld,
      generateOpeningSlots,
      settleWorldTour,
      operationRate,
      settleAlbumSales,
      worldWeek,
      settleLabelWeek,
      albumStreams,

      updateChartRecords,
      settleAudience,
      applyAudienceEvent,

      finishCareerWeek,

      catalogReport,
      weeklyNews,
      log,
      compact,
      fmt,
      money,
    } = h;
    tickMarket();
    beginCareerWeek();
    settleLivingWorld();
    generateOpeningSlots();
    settleWorldTour();
    const overheadRate = operationRate();
    let count = 0,
      added = 0,
      debut = [];
    ({ count, added, debut } = global.ENCORE_RELEASES.settle(s, h));
    settleAlbumSales();
    worldWeek();
    settleLabelWeek();
    s.chartWeek = s.week;
    for (const a of s.albums)
      if (a.debutStreams === undefined && a.week === s.week)
        a.debutStreams = albumStreams(a);
    let rankings = compileSongs();
    updateChartRecords(rankings);
    rankings.forEach((x, i) => {
      if (x.you) {
        let track = s.songs.find((y) => y.id === x.id);
        track.peak = Math.min(track.peak || Infinity, i + 1);
      }
    });
    s.streams = count;
    s.total += count;
    added = settleAudience(count, added);
    added = applyAudienceEvent("streaming", added, {
      reach: s.expansion.listeners,
    });
    updateCareerWorld();
    let royalties = Math.round(count * 0.5 * 100) / 100;
    const financial = closeFinances(royalties, overheadRate);
    s.energy = 200;
    if (added > 0) s.loyalty = clamp(s.loyalty + 1);
    s.careerRecords.royalties += royalties;
    s.lastReport = {
      cashChange: financial.net,
      finance: financial,
      streams: count,
      fans: added,
      royalties,
      debut: debut.map((x) => x.id),
    };
    finishCareerWeek();
    let completed = s.week;
    const earned = scanAchievements();
    catalogReport(completed);
    weeklyNews(completed);
    s.week++;
    s.boost = 0;

      count
        ? compact(count) +
            " streams, " +
            fmt(added) +
            " net fans, and " +
            money(royalties) +
            " in royalties."

function rivalBlock(s,id){const b=s.labelCompetition?.bids?.[id];if(!b?.offers?.length||b.status!=='active')return'';return `<section class="ui2-neg-rivals"><span class="ui2-kicker">MARKET PRESSURE</span><h3>${b.offers.length} rival bid${b.offers.length===1?'':'s'} active</h3>${b.offers.map((o,i)=>`<div><span>Rival ${i+1}</span><strong>${money(o.advance)} advance</strong><small>${Math.round(num(o.share)*100)}% company share</small></div>`).join('')}</section>`}
function termsForm(s,id,t,status){const req=engine.terms(s,id,t.type,t.share,t.weeks);return `<form class="ui2-neg-form" data-neg-form><label>Deal structure<select name="type"><option value="record" ${t.type==='record'?'selected':''}>Recording deal</option><option value="distribution" ${t.type==='distribution'?'selected':''}>Distribution deal</option><option value="360" ${t.type==='360'?'selected':''}>360 deal</option></select></label><label>Signing advance<input name="advance" type="number" min="0" step="1" value="${Math.round(num(t.advance))}" required></label><label>Company share<input name="share" type="number" min="1" max="90" step="0.1" value="${+(num(t.share)*100).toFixed(1)}" required><small>Artist keeps ${(100-num(t.share)*100).toFixed(1).replace('.0','')}%</small></label><label>Contract length<input name="weeks" type="number" min="4" max="104" step="1" value="${Math.round(num(t.weeks))}" required><small>4–104 weeks</small></label><div class="ui2-neg-preview"><span>Current artist request</span><strong data-neg-required>${money(req.minimum)}</strong><small>Company reputation required: ${req.reputation}</small></div><button class="ui2-neg-present" type="submit">${status==='counter'?'Present revised offer':'Present offer'} →</button></form>`}
function renderRoom(s,id,terms=null,result=null){const main=document.querySelector('.ui2-main'),a=(s.world||[]).find(x=>Number(x.id)===Number(id));if(!main||!a)return;let n;try{n=engine.open(s,id)}catch(e){toast(e.message,true);return}let t=terms||{type:'record',share:.1,weeks:26,advance:engine.terms(s,id,'record',.1,26).minimum};if(result?.status==='counter')t={...result.terms,advance:result.ask};room={id:Number(id),state:s,terms:t,status:result?.status||'open'};const current=s.labelLeague?.contracts?.[id],buyout=engine.buyout(s,id);main.innerHTML=`<section class="ui2-neg-room"><header class="ui2-neg-head"><button type="button" data-neg-back>← Roster</button><span class="ui2-kicker">PRIVATE NEGOTIATION · ROUND ${Math.max(1,num(n.rounds)+1)}</span><h1>${esc(a.name)}</h1><p>${esc(s.labelBusiness?.company?.name||'Your company')} · artist acquisition meeting</p></header><section class="ui2-neg-scene"><div class="ui2-neg-person">${face(a.name)}</div><div class="ui2-neg-identity"><small>ACROSS THE TABLE</small><strong>${esc(a.name)}</strong><span>${esc(a.genre||'Artist')} · ${compact(a.fans)} fans${current?` · under contract elsewhere`:''}</span></div><blockquote>${esc(n.response||'The artist is willing to hear an offer.')}</blockquote></section><section class="ui2-neg-meterrail">${meters(n)}</section>${rivalBlock(s,id)}<section class="ui2-neg-sheet"><div class="ui2-neg-sheet-head"><span class="ui2-kicker">YOUR PROPOSAL</span><h2>${result?.status==='counter'?'They countered. Your move.':'Put the deal on the table.'}</h2><p>Broader rights, larger company participation and longer control increase the artist’s asking price.${buyout?` A ${money(buyout)} current-label buyout is also required if terms are accepted.`:''}</p></div>${termsForm(s,id,t,result?.status)}</section></section>`;bindRoom();try{window.scrollTo({top:0,behavior:'instant'})}catch{window.scrollTo(0,0)}}
function renderAccepted(s,id,t){const main=document.querySelector('.ui2-main'),a=(s.world||[]).find(x=>Number(x.id)===Number(id)),n=engine.ensure(s,id),fee=engine.buyout(s,id);if(!main||!a)return;room={id,state:s,terms:t,status:'accepted'};main.innerHTML=`<section class="ui2-neg-room accepted"><header class="ui2-neg-head"><button type="button" data-neg-back>← Roster</button><span class="ui2-kicker">TERMS ACCEPTED</span><h1>Agreement ready.</h1><p>${esc(a.name)} accepted the business terms.</p></header><section class="ui2-neg-accepted"><div class="ui2-neg-person small">${face(a.name)}</div><div><span>ARTIST</span><strong>${esc(a.name)}</strong><p>${esc(n.response||'Legal is preparing the agreement.')}</p></div></section><div class="ui2-contract-summary"><div><span>Advance</span><strong>${money(t.advance)}</strong></div><div><span>Current-label buyout</span><strong>${money(fee)}</strong></div><div><span>Company / artist split</span><strong>${+(t.share*100).toFixed(1)}% / ${+((1-t.share)*100).toFixed(1)}%</strong></div><div><span>Term</span><strong>${t.weeks} weeks</strong></div><div><span>Rights</span><strong>${t.type==='360'?'Recording + live + merchandise':t.type==='distribution'?'Distribution':'Recording'}</strong></div><div><span>Total cash due now</span><strong>${money(num(t.advance)+fee)}</strong></div></div><div class="ui2-neg-sign-actions"><button type="button" data-neg-revise>Keep negotiating</button><button type="button" data-neg-sign>Sign artist · 10⚡ →</button></div></section>`;bindRoom();try{window.scrollTo({top:0,behavior:'instant'})}catch{window.scrollTo(0,0)}}
function renderWalked(s,id){const main=document.querySelector('.ui2-main'),a=(s.world||[]).find(x=>Number(x.id)===Number(id)),n=engine.ensure(s,id);if(!main||!a)return;main.innerHTML=`<section class="ui2-neg-room"><header class="ui2-neg-head"><button type="button" data-neg-back>← Roster</button><span class="ui2-kicker">TALKS ENDED</span><h1>${esc(a.name)} walked.</h1><p>${esc(n.response||'Negotiations ended.')}</p></header><div class="ui2-neg-walked"><strong>Reopen after Week ${n.walkedUntil||'—'}</strong><p>Patience and interest fell below the level needed to keep the negotiation alive.</p><button data-neg-back>Return to roster</button></div></section>`;bindRoom()}
async function present(form){if(busy||!room)return;busy=true;try{const snap=await latest(),s=snap.save.state,f=new FormData(form),t={type:String(f.get('type')),advance:Number(f.get('advance')),share:Number(f.get('share'))/100,weeks:Number(f.get('weeks'))},result=engine.present(s,room.id,t);await persist(snap,s);if(result.status==='accepted')renderAccepted(s,room.id,result.terms);else if(result.status==='walked')renderWalked(s,room.id);else renderRoom(s,room.id,result.terms,result)}catch(e){toast(e.message,true)}finally{busy=false}}
async function sign(){if(busy||!room)return;busy=true;try{const snap=await latest(),s=snap.save.state,result=engine.sign(s,room.id,room.terms);await persist(snap,s);toast(`${result.artist.name} signed · ${money(result.totalCost)} total cost`);setTimeout(()=>document.querySelector('[data-route="business"]')?.click(),350)}catch(e){toast(e.message,true)}finally{busy=false}}
function back(){document.querySelector('[data-route="business"]')?.click();setTimeout(()=>document.querySelector('[data-business-area="roster"]')?.click(),80)}
function bindRoom(){const form=document.querySelector('[data-neg-form]');form?.addEventListener('input',()=>{try{const f=new FormData(form),t={type:String(f.get('type')),share:Number(f.get('share'))/100,weeks:Number(f.get('weeks')),advance:Number(f.get('advance'))},r=engine.terms(room.state,room.id,t.type,t.share,t.weeks),n=form.querySelector('[data-neg-required]');if(n)n.textContent=money(r.minimum)}catch{}})}
async function mountScout(host){if(host.dataset.phase9==='1')return;host.dataset.phase9='1';const s=await latest().then(x=>x.save.state).catch(()=>null);if(!s||!host.isConnected)return;const co=s.labelBusiness?.company;if(!co){host.insertAdjacentHTML('beforeend','<div class="ui2-neg-scout"><div class="ui2-section-title"><h2>Talent market</h2><small>Company required</small></div><p class="ui2-neg-empty">Found your record company before approaching artists.</p></div>');return}const signed=new Set(engine.activeContracts(s).map(c=>Number(c.artist))),capacity=engine.capacity(s),candidates=(s.world||[]).filter(a=>!signed.has(Number(a.id))).sort((a,b)=>num(b.fans)-num(a.fans)).slice(0,16);host.insertAdjacentHTML('beforeend',`<section class="ui2-neg-scout"><div class="ui2-section-title"><h2>Talent market</h2><small>${signed.size}/${capacity} roster spaces used</small></div>${candidates.map(a=>{const n=engine.ensure(s,a.id),fee=engine.buyout(s,a.id),locked=n.status==='walked'&&num(s.week)<num(n.walkedUntil);return `<button type="button" data-neg-open="${a.id}" ${signed.size>=capacity||locked?'disabled':''}><span class="ui2-neg-mini">${esc(String(a.name||'?').slice(0,1))}</span><span><strong>${esc(a.name||'Artist')}</strong><small>${esc(a.genre||'')} · ${compact(a.fans)} fans · relationship ${Math.round(num(a.relation))}${fee?` · buyout ${money(fee)}`:''}</small></span><b>${locked?`W${n.walkedUntil}`:'NEGOTIATE →'}</b></button>`}).join('')}</section>`)}
function scan(){document.querySelectorAll('.ui2-business-area[data-business-screen="roster"]').forEach(mountScout)}
document.addEventListener('submit',e=>{if(e.target.matches?.('[data-neg-form]')){e.preventDefault();e.stopImmediatePropagation();present(e.target)}},true);
document.addEventListener('click',e=>{const open=e.target.closest?.('[data-neg-open]');if(open){e.preventDefault();e.stopImmediatePropagation();latest().then(x=>renderRoom(x.save.state,Number(open.dataset.negOpen))).catch(err=>toast(err.message,true));return}if(e.target.closest?.('[data-neg-back]')){e.preventDefault();e.stopImmediatePropagation();back();return}if(e.target.closest?.('[data-neg-revise]')){e.preventDefault();e.stopImmediatePropagation();if(room)renderRoom(room.state,room.id,room.terms);return}if(e.target.closest?.('[data-neg-sign]')){e.preventDefault();e.stopImmediatePropagation();sign()}},true);
new MutationObserver(scan).observe(document.documentElement,{subtree:true,childList:true});scan();
})();

/* ENCORE UI2 Phase 10 — Honors + Wealth.
   Native read surfaces over the authoritative save; no legacy renderer fallback. */
(()=>{
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const compact=v=>{const n=num(v),a=Math.abs(n);for(const [s,u] of [[1e15,'Qa'],[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']])if(a>=s)return `${(n/s).toFixed(a>=s*100?0:a>=s*10?1:2).replace(/\.0+$/,'')}${u}`;return Math.round(n).toLocaleString('en-US')};
const money=v=>{const n=num(v),a=Math.abs(n);if(a>=1e6)return `${n<0?'−':''}$${compact(a)}`;return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n)};
const hash=v=>{let h=2166136261>>>0;for(const c of String(v||'')){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h>>>0};
let view=null,wealthTab='overview';
async function latest(){const r=await fetch(globalThis.ENCORE_UI2_SAVE_URL||'/api/save',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error(`Career read failed (${r.status}).`);const p=await r.json();if(!p?.save?.state)throw Error('No career save is loaded.');return p.save.state}
function toast(text){let n=document.getElementById('ui2-toast');if(!n){n=document.createElement('div');n.id='ui2-toast';n.className='ui2-toast';document.body.appendChild(n)}n.textContent=text;n.classList.add('is-visible');setTimeout(()=>n.classList.remove('is-visible'),2400)}
function back(){document.querySelector('[data-route="more"]')?.click()}
function honors(s){const ceremonies=(s.v080?.awards?.ceremonies||[]).slice().reverse(),latestCeremony=ceremonies[0],wins=num(s.expansion?.awardWins),noms=num(s.expansion?.awardNominations),celebrations=(s.achievements?.briefings||[]).filter(x=>x.type==='Celebration').slice().reverse().slice(0,8),milestones=(s.expansion?.timeline||[]).slice().reverse().slice(0,10);return `<section class="ui2-honors"><header class="ui2-honors-hero"><button data-phase10-back>← More</button><span class="ui2-kicker">INDUSTRY RECOGNITION</span><h1>THE ENCORE<br>HONORS</h1><p>Your awards, nominations, milestones and career moments in one living archive.</p><div class="ui2-honors-career"><div><strong>${wins}</strong><span>Career wins</span></div><div><strong>${noms}</strong><span>Nominations</span></div><div><strong>${ceremonies.length}</strong><span>Ceremonies</span></div></div></header>${latestCeremony?`<section class="ui2-honors-current"><div class="ui2-section-title"><h2>Year ${latestCeremony.year} Ceremony</h2><small>${latestCeremony.wins} wins · ${latestCeremony.nominations} nominations</small></div><div class="ui2-honors-results">${(latestCeremony.results||[]).map((r,i)=>`<article class="${r.won?'won':r.nominated?'nominated':''}"><span>${String(i+1).padStart(2,'0')}</span><div><small>${esc(r.category)}</small><strong>${esc(r.winner||'No winner')}</strong><p>${r.won?'YOU WON':r.nominated?'NOMINATED':`Score ${Math.round(num(r.score))}`}</p></div><b>${r.won?'★':r.nominated?'●':'—'}</b></article>`).join('')}</div></section>`:`<section class="ui2-honors-await"><strong>Your first ENCORE Honors ceremony arrives at the end of Year 1.</strong><p>Music performance, audience reach, touring, collaborations and career impact all shape the field.</p></section>`}<section class="ui2-honors-history"><div class="ui2-section-title"><h2>Ceremony History</h2><small>${ceremonies.length} recorded</small></div>${ceremonies.length?ceremonies.map(c=>`<div><span>YEAR ${c.year}</span><strong>${c.wins} wins</strong><em>${c.nominations} nominations · Week ${c.week}</em></div>`).join(''):'<p>No completed ceremonies yet.</p>'}</section><section class="ui2-honors-moments"><div class="ui2-section-title"><h2>Career Milestones</h2><small>landmark moments</small></div>${milestones.length?milestones.map(x=>`<div><time>W${x.week}</time><section><strong>${esc(x.title||'Career milestone')}</strong><p>${esc(x.detail||'')}</p></section></div>`).join(''):'<p>Your next career first will appear here.</p>'}</section>${celebrations.length?`<section class="ui2-honors-celebrations"><div class="ui2-section-title"><h2>Celebrations</h2><small>${celebrations.length} recent</small></div>${celebrations.map(x=>`<div><span>W${x.week}</span><section><strong>${esc(x.title||'Career moment')}</strong><p>${esc(x.body||'')}</p></section></div>`).join('')}</section>`:''}</section>`}
function assetIcon(kind){const labels={Cars:'CAR',Jewelry:'GEM',Art:'ART',Property:'HOME',Stocks:'EQ',Bonds:'BOND',Crypto:'CRYPTO'};return labels[kind]||String(kind||'ASSET').slice(0,6).toUpperCase()}
function assetVisual(a){const h=hash(`${a.item}|${a.name}`),h1=h%360,h2=(h1+55+(h>>>7)%90)%360;return `<span class="ui2-wealth-visual" style="--wa:hsl(${h1} 25% 18%);--wb:hsl(${h2} 42% 32%)"><small>${esc(assetIcon(a.kind))}</small><strong>${esc(String(a.name||'A').slice(0,1))}</strong></span>`}
function wealthTotals(s){const assets=s.empire?.assets||[],assetValue=assets.reduce((n,a)=>n+num(a.value),0),basis=assets.reduce((n,a)=>n+num(a.basis),0),catalog=(s.v080?.catalog?.holdings||[]),catalogBasis=catalog.reduce((n,h)=>n+num(h.basis),0),catalogPaid=catalog.reduce((n,h)=>n+num(h.payouts),0);return {assets,assetValue,basis,catalog,catalogBasis,catalogPaid,wealth:num(s.cash)+assetValue}}
function wealthOverview(s,t){const kinds=[...new Set(t.assets.map(a=>a.kind))];return `<section class="ui2-wealth-overview"><div class="ui2-wealth-ledger"><div><small>Spendable cash</small><strong>${money(s.cash)}</strong></div><div><small>Owned assets</small><strong>${money(t.assetValue)}</strong></div><div><small>Physical / market basis</small><strong>${money(t.basis)}</strong></div><div><small>Estimated wealth</small><strong>${money(t.wealth)}</strong></div></div><div class="ui2-section-title"><h2>Ownership Mix</h2><small>${t.assets.length} holdings</small></div><div class="ui2-wealth-mix">${kinds.length?kinds.map(kind=>{const list=t.assets.filter(a=>a.kind===kind),value=list.reduce((n,a)=>n+num(a.value),0);return `<div><span>${esc(kind)}</span><i><b style="width:${t.assetValue?Math.max(4,value/t.assetValue*100):0}%"></b></i><strong>${money(value)}</strong></div>`}).join(''):'<p>No personal or investment assets yet.</p>'}</div><div class="ui2-section-title"><h2>Recent Money Activity</h2><small>${Math.min(10,(s.empire?.transactions||[]).length)} entries</small></div><div class="ui2-wealth-transactions">${(s.empire?.transactions||[]).slice(0,10).map(x=>`<div><span>${esc(x.text||'Transaction')}</span><strong class="${num(x.amount)<0?'negative':'positive'}">${money(x.amount)}</strong><small>Week ${x.week??s.week}</small></div>`).join('')||'<p>No ownership transactions yet.</p>'}</div></section>`}
function wealthHoldings(s,t){return `<section class="ui2-wealth-holdings"><div class="ui2-section-title"><h2>Owned Assets</h2><small>${t.assets.length} positions</small></div>${t.assets.length?t.assets.map(a=>{const change=num(a.value)-num(a.basis);return `<div class="ui2-wealth-holding">${assetVisual(a)}<section><small>${esc(a.kind||'Asset')} · ${num(a.qty)||1} unit${num(a.qty)===1?'':'s'}</small><strong>${esc(a.name||'Owned asset')}</strong><p>${money(a.value)} current value · ${money(a.basis)} basis</p><span class="${change<0?'negative':'positive'}">${change>=0?'+':''}${money(change)} unrealized${a.condition===null?'':` · ${Math.round(num(a.condition))}% condition`}</span>${a.kind==='Property'?`<em>${a.tenant?`${esc(a.tenant.name||'Tenant')} · ${money(a.tenant.rent||a.rent)}/month`:'Vacant / personal use'}</em>`:''}</section></div>`}).join(''):'<div class="ui2-wealth-empty">Nothing owned yet. Your collection, investments and properties will accumulate here.</div>'}</section>`}
function wealthCatalog(s,t){return `<section class="ui2-wealth-catalog"><div class="ui2-section-title"><h2>Catalog Ownership</h2><small>${t.catalog.length} positions</small></div>${t.catalog.length?t.catalog.map(h=>`<div><span>${Math.round(num(h.share)*100)}%</span><section><strong>${esc(h.name||'Catalog')}</strong><p>${money(h.basis)} cost basis · ${money(h.payouts||0)} distributions received</p></section></div>`).join(''):'<div class="ui2-wealth-empty">You do not own an outside catalog position yet.</div>'}<footer><span>Catalog basis</span><strong>${money(t.catalogBasis)}</strong><span>Distributions</span><strong>${money(t.catalogPaid)}</strong></footer></section>`}
function wealth(s){const t=wealthTotals(s);return `<section class="ui2-wealth"><header class="ui2-wealth-head"><button data-phase10-back>← More</button><span class="ui2-kicker">WEALTH & OWNERSHIP</span><h1>${money(t.wealth)}</h1><p>What you own, what it cost, what it is worth now, and how money has moved through the career.</p></header><nav class="ui2-wealth-tabs"><button class="${wealthTab==='overview'?'active':''}" data-wealth-tab="overview">Overview</button><button class="${wealthTab==='holdings'?'active':''}" data-wealth-tab="holdings">Holdings</button><button class="${wealthTab==='catalog'?'active':''}" data-wealth-tab="catalog">Catalog</button></nav><div class="ui2-wealth-body">${wealthTab==='holdings'?wealthHoldings(s,t):wealthTab==='catalog'?wealthCatalog(s,t):wealthOverview(s,t)}</div></section>`}
async function open(which){try{const s=await latest(),main=document.querySelector('.ui2-main');if(!main)return;view=which;main.innerHTML=which==='honors'?honors(s):wealth(s);main._phase10State=s;try{window.scrollTo({top:0,behavior:'instant'})}catch{window.scrollTo(0,0)}}catch(e){toast(e.message)}}
function interceptMore(button){const title=button.querySelector('strong')?.textContent?.trim()||'';if(title==='Awards & Honors')return'honors';if(title==='Wealth & Assets')return'wealth';return null}
document.addEventListener('click',e=>{const btn=e.target.closest?.('.ui2-more-group button');if(btn){const target=interceptMore(btn);if(target){e.preventDefault();e.stopImmediatePropagation();open(target);return}}if(e.target.closest?.('[data-phase10-back]')){e.preventDefault();e.stopImmediatePropagation();back();return}const tab=e.target.closest?.('[data-wealth-tab]');if(tab){e.preventDefault();wealthTab=tab.dataset.wealthTab;const s=document.querySelector('.ui2-main')?._phase10State;if(s){const main=document.querySelector('.ui2-main');main.innerHTML=wealth(s);main._phase10State=s}}},true);
})();
</script>
