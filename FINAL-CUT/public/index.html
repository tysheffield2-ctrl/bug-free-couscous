function market(){const open=game.pitches.filter(p=>p.stage==='Funding').sort((a,b)=>a.deadline-b.deadline);const fin=F.financials(game);const activeInv=game.investments.filter(i=>['Funding','Production'].includes(i.stage));

>Indicative term sheet</div><div class="card-top"><div><div class="stat-value" id="offer-share">${percent(base)}</div><div class="stat-label">of selected producer revenue pool</div></div><div class="align-right"><div class="stat-value" id="offer-exposure">${M(amt)}</div><div class="stat-label">at risk</div></div></div><div class="subtle mt-8">Financing may fail if the round closes underfunded. Preferred and standard investors recover principal differently.</div></div><button class="button full" type="submit">Submit financing offer</button></form>`:`<div class="notice">This financing round is ${E(p.stage.toLowerCase())}. Existing player stakes appear in your portfolio.</div>`}<div class="card"><strong style="font-size:12px">How the investor waterfall works</strong><p>Ticket sales first pay theaters. Distributor fees and release marketing reduce the cash available to producers. Invested production capital is then recouped; any remaining distributable profit is shared according to negotiated agreements.</p><div class="quote">Actual contracts can be far more complex, with territorial splits, cross-collateralization, residuals, financing charges and reporting delays. This game models a simplified version.</div></div>`;}

function applications(){const apps=[...game.applications];const items=applicationFilter==='all'?apps:applicationFilter==='auditions'?apps.filter(a=>['Submitted','Callback','Offer','Rejected','Withdrawn','Expired'].includes(a.stage)):applicationFilter==='bookings'?apps.filter(a=>a.stage==='Booked'):apps.filter(a=>a.stage==='Released');
 const tabs=[['all','All'],['auditions','Auditions'],['bookings','Bookings'],['releases','Releases']];return `${back('career')}${intro('Career history','All applications','Every submitted audition, callback, negotiated contract, booking, and release remains in your file.')}
 <div class="switcher application-tabs">${tabs.map(([key,label])=>`<button type="button" data-act="application-filter" data-id="${key}" class="${applicationFilter===key?'selected':''}">${label}</button>`).join('')}</div>

function applicationDetail(id){const a=game.applications.find(a=>a.id===id);if(!a)return `${back('applications')}<div class="empty">Application unavailable.</div>`;const c=a.contract;const live=a.stage==='Offer'&&a.offerDeadline>=game.week;
 return `${back('applications')}${intro(`${a.kind} · ${a.studio}`,a.title,`${a.part} · ${a.medium} · ${a.renewal?'Returning season '+a.season:a.tier}`)}<div class="banners">${badge(a.stage)}${a.unionOnly?badge('Guild contract'):''}</div>

 ${live?`<div class="card"><div class="meta">CONTRACT OFFER · EXPIRES WEEK ${a.offerDeadline}</div><div class="detail-grid">${stat('Total salary',M(c.salary))}${stat('Backend',percent(c.backendRate))}${stat('Episodes',c.episodes)}${stat('Billing',E(c.billing))}</div><p class="subtle">Signing: 30% of salary, less applicable commission and fictional guild dues. Remaining salary paid after filming. Backend depends on producer receipts and may return $0.</p>${!a.negotiated?`<div class="meta mt-8">Counteroffer · Choose one</div><div class="triple-actions">${btn('+22% salary','counter',a.id,'small-button','data-type="salary"')}${btn('Backend points','counter',a.id,'small-button','data-type="backend"')}${btn('Better billing','counter',a.id,'small-button','data-type="billing"')}</div>`:'<div class="subtle">Negotiation completed. The offer above reflects the current agreed terms.</div>'}${btn('Accept contract','accept-offer',a.id,'button full mt-8')}${btn('Decline offer','withdraw',a.id,'button outline full mt-8')}</div>`:''}

function gigDetail(id){const g=game.gigs.find(g=>g.id===id);if(!g)return `${back('career')}<div class="empty">This role was not found.</div>`;const isActive=g.stage==='Booked';return `${back('applications')}${intro(`${g.medium} · ${g.kind}`,g.title,`${g.part} · ${g.studio} · Season ${g.season||1}`)}

function sparkline(values){const w=320,h=118,pts=values.length>1?values:[0,0],hi=Math.max(...pts,1),lo=Math.min(...pts,0),span=hi-lo||1;const dots=pts.map((v,i)=>`${(i/(pts.length-1))*(w-16)+8},${h-12-(v-lo)/span*(h-26)}`),coords=dots.join(' ');return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" role="img" aria-label="Historical trend line"><polyline points="${coords}" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="${h-12}" x2="${w-8}" y2="${h-12}" stroke="currentColor" opacity=".22"/></svg>`;}
function fans(){const pl=game.player,history=pl.fanHistory||[],last=history.at(-1)?.delta||0;const works=game.gigs.filter(g=>g.stage==='Released'&&g.fansGained).slice(0,8);return `${back('career')}${intro('The audience','Your fanbase','Fans respond to acting performances, reviews, premieres and awards—not only time passing.')}

function finances(){const summary=F.careerSummary(game),entries=[...game.ledger],categories={};for(const l of entries){categories[l.category]=(categories[l.category]||0)+l.amount;}const h=[];for(let w=Math.max(1,game.week-23);w<=game.week;w++)h.push(entries.filter(l=>l.week===w).reduce((v,l)=>v+l.amount,0));return `${back('career')}${intro('Career finance','Earnings and expenses','Every tracked cash movement from acting, training, residuals, producer deals and studio activity is listed below.')}
 <div class="metrics">${stat('Available cash',M(game.cash))}${stat('Residuals earned',M(game.player.residualIncome))}${stat('Net transactions',`${summary.net>=0?'+':'−'}${M(Math.abs(summary.net))}`,summary.net>=0?'positive':'negative')}</div>
 <div class="card"><div class="card-top"><strong>Weekly net cash flow</strong><small>Last 24 weeks</small></div>${sparkline(h)}<div class="detail-grid">${stat('Recorded incoming',M(summary.grossIncome))}${stat('Recorded outgoing',M(summary.outgo))}</div></div>
 ${section('By activity')}<div class="list">${Object.entries(categories).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([key,value])=>`<div class="finance-item"><span>${E(key)}</span><strong class="${value>=0?'positive':'negative'}">${value>=0?'+':'−'}${M(Math.abs(value))}</strong></div>`).join('')||'<div class="empty">Your financial activity will appear here.</div>'}</div>
 ${section('Transaction ledger')}<div class="list">${entries.slice(0,35).map(l=>`<div class="finance-item"><div><div class="finance-label">${E(l.detail)}</div><div class="subtle">Week ${l.week} · ${E(l.category)}</div></div><strong class="${l.amount>=0?'positive':'negative'}">${l.amount>=0?'+':'−'}${M(Math.abs(l.amount))}</strong></div>`).join('')||'<div class="empty">No transactions yet.</div>'}</div><div class="light-tip">Income is shown net of simulated agent commissions and guild deductions where applicable. Taxes, living costs, and full liability accounting are not yet modeled. Imported older careers do not have complete historical transaction ledgers.</div>`;}
function reputation(){const pl=game.player,sm=F.careerSummary(game),releases=game.gigs.filter(g=>g.stage==='Released'),grades=[['Awards',Math.min(100,(pl.awards*35+pl.nominations*10)),`${pl.awards} wins and ${pl.nominations} nominations`],['Box office',F.clamp(pl.fame*.65+Math.min(40,releases.filter(g=>g.medium==='Film').length*4),0,100),`${releases.filter(g=>g.medium==='Film').length} released film credits`],['Experience',F.clamp(pl.experience/4,0,100),`${pl.experience} career experience`],['Fans',F.clamp(Math.log10(pl.fans+1)*14,0,100),`${pl.fans.toLocaleString('en-US')} fans`],['Public image',pl.reputation,`${pl.reputation}/100 professional reputation`],['Reviews',sm.averageCritic??0,sm.averageCritic!==null?`Average critic review ${sm.averageCritic}/100`:'Awaiting your first release'],['Talent',pl.skills.acting,`${pl.skills.acting}/100 acting technique`],['Television',F.clamp(releases.filter(g=>g.medium==='TV').length*12,0,100),`${releases.filter(g=>g.medium==='TV').length} completed TV appearances`]];
 const grade=v=>v>=92?'A+':v>=82?'A':v>=72?'B+':v>=60?'B':v>=48?'C':v>=30?'D':'—';return `${back('career')}${intro('Industry standing','Reputation report','Separate career metrics mean popularity, critical acclaim and professional skill can tell different stories.')}
 <div class="rating-grid">${grades.map(([name,value,desc])=>`<div class="rating-card"><div><div class="meta">★ ${E(name.toUpperCase())}</div><p>${E(desc)}</p></div><span class="letter-grade">${grade(value)}</span></div>`).join('')}</div>${section('Awards history')}<div class="list">${pl.awardHistory.length?pl.awardHistory.map(x=>row('award',x.title,`${x.category} · Week ${x.week}`,'nav','career',badge(x.type))).join(''):'<div class="empty">Awards appear after competitive releases and an awards-season evaluation. There are no automatic wins.</div>'}</div>`;}
function review(){const entries=game.ledger.filter(l=>l.week===game.week),incoming=entries.filter(l=>l.amount>0).reduce((v,l)=>v+l.amount,0),outgoing=-entries.filter(l=>l.amount<0).reduce((v,l)=>v+l.amount,0),events=game.feed.filter(e=>e.week===game.week);return `${back('career')}${intro('Weekly dispatch',`Week ${game.week} review`,'A clear account of your progress, work, receipts and expenses.')}<div class="metrics">${stat('Income',M(incoming),'positive')}${stat('Expenses',M(outgoing),'negative')}${stat('Net',M(incoming-outgoing))}</div>${section('Activity this week')}<div class="card">${events.length?events.map(e=>`<div class="activity"><span class="dot ${A(e.kind)}"></span><div class="copy">${E(e.msg)}</div></div>`).join(''):'<p>No major news this week. Train, apply, rehearse or advance time to move your career forward.</p>'}</div>${section('Transactions')}<div class="list">${entries.map(e=>`<div class="finance-item"><span>${E(e.detail)}</span><strong class="${e.amount>=0?'positive':'negative'}">${e.amount>=0?'+':'−'}${M(Math.abs(e.amount))}</strong></div>`).join('')||'<div class="empty">No receipts or expenses recorded this week.</div>'}</div>`;}

s speculative franchise value and outstanding liabilities.</p><div class="list">${row('graph','Industry reports','Competition, market trends, top releases','nav','industry')}${row('wallet','Investments & financial returns',`${game.investments.length} portfolio agreements`,'nav','portfolio')}${row('shield','Sandbox controls',game.sandbox?'Enabled · Edit cash, fame and skills':'Optional test mode and stat editor','nav','sandbox')}${row('settings','Settings & saved game','Theme, export, import, new career','nav','settings')}</div>${section('Acquire facilities')}<div class="list">${Object.entries(F.UPGRADES).map(([id,u])=>`<div class="card" style="margin-bottom:0"><div class="card-top"><div style="flex:1"><strong style="font-size:13px">${E(u.title)}</strong><p>${E(u.desc)}</p></div><div class="align-right"><div class="stat-value">${M(u.price)}</div><div class="mt-8">${up.includes(id)?badge('Owned'):btn('Buy','upgrade',id,'small-button')}</div></div></div></div>`).join('')}</div>${section('Recently settled projects')}<div class="list">${game.history.length?game.history.slice(0,8).map(h=>row('clapper',h.title,`${h.medium} · Released W${h.week}`,'project',h.id,`<span class="row-amount ${h.profit>=0?'positive':'negative'}">${h.profit>=0?'+':'-'}${M(Math.abs(h.profit))}</span>`)).join(''):'<div class="empty">Your studio has not yet settled a production.</div>'}</div>`;}
function industry(){const top=[...game.industry].sort((a,b)=>b.gross-a.gross).slice(0,10);return `${back('studio')}${intro('Industry intelligence','The market','Other studios operate and release films while you advance time. Genre demand changes and influences project performance.')}<div class="card">${section('Genre demand indices')}${F.GENRES.map(g=>`<div class="skill-line"><span>${E(g)}</span><div class="skill-track"><i style="width:${Math.min(100,Math.round(game.trends[g]*68))}%"></i></div><span class="skill-number">${Math.round(game.trends[g]*100)}%</span></div>`).join('')}</div>${section('Biggest competing releases')}<div class="list">${top.map((r,i)=>`<div class="white-row" style="cursor:default"><span class="row-icon" style="font-size:12px;font-weight:800">${i+1}</span><span class="row-main"><span class="row-title">${E(r.title)}</span><span class="row-sub" style="display:block">${E(r.studio)} · ${E(r.genre)} · W${r.week}</span></span><span class="row-end"><span class="row-amount">${M(r.gross)}</span></span></div>`).join('')}</div>${section('Industry news')}<div class="card">${game.feed.slice(0,20).map(x=>`<div class="activity"><div class="dot ${A(x.kind)}"></div><div class="copy">${E(x.msg)}</div><div class="when">W${x.week}</div></div>`).join('')}</div>`;}
function sandbox(){return `${back('studio')}${intro('Developer tools','Sandbox mode','Experiment with extreme fame, cash and career skills without grinding. Once enabled, the save is marked sandbox.')}<div class="card"><div class="card-top"><div><h3>${game.sandbox?'Sandbox enabled':'Sandbox disabled'}</h3><p>Enable edits to cash, fame, reputation, and training attributes.</p></div>${btn(game.sandbox?'Enabled ✓':'Enable','sandbox-toggle','',game.sandbox?'button green':'button')}</div></div>${game.sandbox?`<form id="sandbox-form" class="form-card"><div class="field"><label for="cash-edit">Cash balance ($)</label><input id="cash-edit" name="cash" type="number" min="0" max="1000000000000000" step="1" value="${game.cash}" /></div><div class="fields-two"><div class="field"><label for="fame-edit">Fame (0–100)</label><input id="fame-edit" name="fame" type="number" min="0" max="100" value="${game.player.fame}" /></div><div class="field"><label for="rep-edit">Reputation</label><input id="rep-edit" name="reputation" type="number" min="0" max="100" value="${game.player.reputation}" /></div></div><div class="fields-two"><div class="field"><label>Experience</label><input name="experience" type="number" min="0" max="99999" value="${game.player.experience}" /></div><div class="field"><label>Classes taken</label><input name="classesTaken" type="number" min="0" max="50" value="${game.player.classesTaken}" /></div><div class="field"><label>Career credits</label><input name="credits" type="number" min="0" max="99999" value="${game.player.actingCredits}" /></div></div><div class="fields-two">${Object.entries(game.player.skills).map(([key,value])=>`<div class="field"><label for="s-${key}">${key.charAt(0).toUpperCase()+key.slice(1)}</label><input id="s-${key}" name="${key}" type="number" min="0" max="100" value="${value}" /></div>`).join('')}</div><button type="submit" class="button full">Apply sandbox edits</button></form>${btn('Advance 12 weeks','advance','12','button soft full')}`:'<div class="notice">Sandbox edits are opt-in. Your normal career retains its original difficulty until you enable them.</div>'}`;}
function settings(){const light=document.body.classList.contains('light');return `${back('studio')}${intro('Preferences','Settings & saves','Progress saves automatically in this browser. Export a backup before clearing browser storage or switching devices.')}<div class="list">${row('sun',light?'Light theme':'Dark theme','Switch between bright and dark shell colors','theme','')}${row('download','Export career backup','Download a JSON copy of your current save','export','')}</div>${section('Import existing save')}<form id="import-form" class="form-card"><div class="field"><label for="import-file">Import JSON file</label><input type="file" id="import-file" accept="application/json,.json"/></div><div class="field"><label for="import-text">Or paste save JSON</label><textarea id="import-text" rows="3" placeholder="Paste the exported save data here"></textarea></div><button type="submit" class="button soft full">Import and replace career</button></form>${section('Danger zone')}<div class="card"><strong>Start a new career</strong><p>This replaces the current browser save. Export first if you want to keep your progress.</p>${btn('Reset current career','reset','','button danger mt-8')}</div>`;}
function render(){const app=$('#app');if(!app)return;if(!game){app.innerHTML=setup();return;}
let view;let id=screen.includes(':')?screen.slice(screen.indexOf(':')+1):'';const page=screen.split(':')[0];
switch(page){case 'home':view=home();break;case 'projects':view=projects();break;case 'create':view=create();break;case 'project':view=project(id);break;case 'market':view=market();break;case 'pitch':view=pitch(id);break;case 'portfolio':view=portfolio();break;case 'investment':view=investment(id);break;case 'auditions':view=auditions();break;case 'casting':view=castingDetail(id);break;case 'applications':view=applications();break;case 'application':view=applicationDetail(id);break;case 'gig':view=gigDetail(id);break;case 'fans':view=fans();break;case 'finance':view=finances();break;case 'reputation':view=reputation();break;case 'review':view=review();break;case 'classes':view=classes();break;case 'guild':view=guild();break;case 'representation':view=representation();break;case 'talent':view=talent();break;case 'career':view=career();break;case 'studio':view=studio();break;case 'industry':view=industry();break;case 'sandbox':view=sandbox();break;case 'settings':view=settings();break;default:view=home();}
app.innerHTML=`<div class="shell">${header()}<main id="main" tabindex="-1">${view}</main></div>${nav()}`;
}
function go(to){screen=to;render();window.scrollTo(0,0);}
function commit(result,success){if(result?.ok){save();if(success)show(success,'info');else render();}else show(result?.msg||'This action could not be completed.','error');}
function handleAction(node){const act=node.dataset.act,id=node.dataset.id;
if(act==='nav'){go(id);return;}if(act==='filter'){filter=id;render();return;}if(act==='application-filter'){applicationFilter=id;render();return;}if(act==='casting-filter'){castingFilter=id;render();return;}
if(act==='project'){go('project:'+id);return;}if(act==='casting'){go('casting:'+id);return;}if(act==='application'){go('application:'+id);return;}if(act==='gig'){go('gig:'+id);return;}if(act==='pitch'){go('pitch:'+id);return;}if(act==='investment'){go('investment:'+id);return;}
if(act==='advance'){F.advance(game,+id);save();render();return;}
if(act==='greenlight'){commit(F.greenlight(game,id));return;}
if(act==='attach'){const role=node.dataset.role;const input=document.getElementById('pick-'+role);const name=input?.value;if(!name){show('Choose an available talent first.','error');return;}commit(F.attach(game,id,role,name));return;}
if(act==='release'){commit(F.release(game,id,node.dataset.type));return;}
if(act==='renew'){const r=F.renewSeason(game,id);if(r.ok){save();go('project:'+r.project.id);}else show(r.msg,'error');return;}
if(act==='audition'){const r=F.audition(game,id);if(r.ok){save();go('application:'+r.application.id);show('Application submitted. Follow its status in your timeline.');}else show(r.msg,'error');return;}if(act==='callback'){const r=F.callback(game,id);commit(r,r.ok?(r.offer?'Callback successful! A contract is waiting.':'The callback ended without an offer.'):'');return;}if(act==='counter'){const r=F.counterOffer(game,id,node.dataset.type);commit(r,r.ok?(r.accepted?'Counteroffer accepted.':r.withdrawn?'Negotiations failed; the offer was withdrawn.':'Counteroffer declined. The original offer remains.'):'');return;}if(act==='accept-offer'){const r=F.acceptOffer(game,id);if(r.ok){save();go('gig:'+r.gig.id);}else show(r.msg,'error');return;}if(act==='withdraw'){commit(F.withdrawApplication(game,id));return;}if(act==='rehearse'){commit(F.rehearse(game,id));return;}
if(act==='train'){commit(F.train(game,id));return;}
if(act==='join-guild'){commit(F.joinGuild(game));return;}
if(act==='showreel'){commit(F.makeShowreel(game));return;}
if(act==='hire-agent'){commit(F.hireAgent(game));return;}
if(act==='upgrade'){commit(F.upgrade(game,id));return;}
if(act==='sandbox-toggle'){if(!game.sandbox){game.sandbox=true;save();render();}return;}
if(act==='theme'){const light=!document.body.classList.contains('light');document.body.classList.toggle('light',light);try{localStorage.setItem(THEMEKEY,light?'light':'dark')}catch(e){}render();return;}
if(act==='export'){const filename=`final-cut-career-w${game.week}.json`;const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);show('Career backup ready to save.');return;}
if(act==='reset'){if(window.confirm('Replace this entire career? Export a backup first if you want to preserve it.')){game=null;screen='home';try{localStorage.removeItem(KEY)}catch(e){}render();}return;}}
function submit(form){const id=form.id;const d=new FormData(form);if(id==='setup-form'){game=F.createGame({name:String(d.get('playerName')||'Alex Morgan')});save();go('home');return;}
if(id==='found-studio-form'){commit(F.foundStudio(game,d.get('name')));return;}
if(id==='create-form'){if(!F.canCreate(game)){show('Finish or release some active projects before adding more.','error');return;}
const result=F.createProject(game,{title:d.get('title'),medium:d.get('medium'),genre:d.get('genre'),budget:+d.get('budget'),role:d.get('role')});if(result.ok){save();go('project:'+result.project.id);}else show(result.msg,'error');return;}
if(id==='investment-form'){const result=F.invest(game,form.dataset.pitch,+d.get('amount'),d.get('stance'),d.get('priority')==='senior',d.get('basis'));save();if(result.ok){go('investment:'+result.investment.id);}else show(result.msg,'error');return;}
if(id==='sandbox-form'){commit(F.sandboxEdit(game,Object.fromEntries([...d.entries()].map(([k,v])=>[k,+v]))),'Sandbox values applied.');return;}
if(id==='import-form'){const raw=String($('#import-text')?.value||'').trim();const file=$('#import-file')?.files?.[0];if(file){const reader=new FileReader();reader.onload=()=>importSave(reader.result);reader.onerror=()=>show('Unable to read that file.','error');reader.readAsText(file);}else importSave(raw);return;}}
function importSave(raw){try{const data=JSON.parse(raw);F.ensureV3(data);if(!F.validState(data))throw new Error('Incompatible save format');game=data;screen='home';save();go('home');show('Career imported successfully.')}catch(e){show('That JSON is not a valid FINAL CUT v0.2/v0.3 save. Your current career is unchanged.','error');}}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;ev.preventDefault();try{handleAction(el);}catch(e){console.error(e);show('Unexpected error. Your progress was preserved.','error');}});
document.addEventListener('submit',ev=>{if(!ev.target.id)return;ev.preventDefault();try{submit(ev.target)}catch(e){console.error(e);show('Unable to complete that action.','error');}});
document.addEventListener('input',ev=>{const form=ev.target.closest('#investment-form');if(!form)return;const p=game.pitches.find(p=>p.id===form.dataset.pitch);if(!p)return;const amount=+form.querySelector('[name=amount]').value||0;const stance=form.querySelector('[name=stance]').value;const senior=form.querySelector('[name=priority]').value==='senior';const receipts=form.querySelector('[name=basis]').value==='receipts';const share=F.clamp((amount/p.budget)*({fair:1,bold:1.25,aggressive:1.55}[stance])*(senior?.86:1)*(receipts?.20:1),.001,receipts?.18:.78);const v=$('#offer-share');if(v)v.textContent=percent(share);const a=$('#offer-exposure');if(a)a.textContent=M(amount);});
document.addEventListener('change',ev=>{if(ev.target.closest('#investment-form'))ev.target.dispatchEvent(new Event('input',{bubbles:true}));});
load();

})();

</script>
</body>
</html>
